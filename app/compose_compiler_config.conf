// Types the Compose compiler cannot prove stable because they live outside this module,
// but which are immutable value types in practice. Declaring them stable lets the AFinity
// domain models that hold them (AfinityMovie, AfinityEpisode, AfinityShow, ...) be inferred
// stable, so skipping compares them with data-class equals() instead of falling back to
// instance equality under strong skipping.
//
// Only add a type here if it is genuinely immutable - this is a promise to the compiler,
// not a hint. A mutable type listed here causes missed recompositions (stale UI).

java.util.UUID
java.time.LocalDateTime
java.time.LocalDate
java.time.LocalTime
java.time.Instant
java.time.Duration
android.net.Uri
