name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check formatting
        run: ./gradlew ktfmtCheck

      - name: Check cancellation rethrows
        if: always()
        run: ./gradlew checkCancellationRethrow

      - name: Compile
        if: always()
        run: ./gradlew compileDebugKotlin

      - name: Unit tests
        if: always()
        run: ./gradlew testDebugUnitTest
