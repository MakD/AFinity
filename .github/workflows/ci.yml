name: CI

on:
  push:
  pull_request:

# A burst of commits on the same ref costs one build, not one per commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Run as its own step so the failing check is obvious in the UI.
      # ktfmt is already configured in the root build (kotlinLangStyle).
      # Fix locally with: ./gradlew ktfmtFormat
      - name: Check formatting
        run: ./gradlew ktfmtCheck

      # always() so a formatting failure still tells you whether it compiles —
      # one push surfaces both problems instead of two round trips.
      - name: Compile
        if: always()
        run: ./gradlew compileDebugKotlin
